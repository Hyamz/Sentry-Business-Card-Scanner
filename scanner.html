<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Scanner">
<meta name="theme-color" content="#0f5c63">
<title>Sentry's Card Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single phone-first column — sticky header, scan bar, search, contacts grouped by the day they were added; sheets slide up for review and detail */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#e7ecef; --line:#d2dade;
  --fg:#1c2a33; --muted:#5f707c; --brand:#34495a; --brand-fg:#ffffff; --teal:#0f5c63; --teal-fg:#ffffff;
  --lime:#62c022; --lime-ink:#2c5a09; --lime-soft:#e5f4d6;
  --danger:#b3261e; --danger-soft:#fbe4e2;
  --shadow:0 10px 30px rgba(28,42,51,.12);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171c; --surface:#172129; --surface-2:#1f2c35; --line:#2b3a45;
  --fg:#e4eaee; --muted:#93a3ae; --brand:#2c3e4c; --brand-fg:#f1f5f7; --teal:#0e4e54; --teal-fg:#eef8f8;
  --lime:#74d332; --lime-ink:#dcf7c4; --lime-soft:#20340f;
  --danger:#ff8a80; --danger-soft:#3a1715; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#172129; --surface-2:#1f2c35; --line:#2b3a45;
  --fg:#e4eaee; --muted:#93a3ae; --brand:#2c3e4c; --brand-fg:#f1f5f7; --teal:#0e4e54; --teal-fg:#eef8f8;
  --lime:#74d332; --lime-ink:#dcf7c4; --lime-soft:#20340f;
  --danger:#ff8a80; --danger-soft:#3a1715; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 10px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.logo{height:34px;width:auto;max-width:100%;display:block}
h1{font-family:var(--f-display);font-size:15px;margin:0;letter-spacing:.01em;color:var(--muted);font-weight:600}
header.top{align-items:flex-end}
.head-right{display:flex;align-items:center;gap:10px}
.btn-sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.scan{background:var(--teal);color:var(--teal-fg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.scan h2{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:0;text-wrap:balance;max-width:20ch}
.scan p{margin:0;opacity:.85;max-width:44ch}
.scan .frame{position:absolute;right:-18px;top:16px;width:120px;height:74px;border:2px dashed currentColor;border-radius:10px;opacity:.22;transform:rotate(-8deg)}
.scan-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:46px;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn-lime{background:var(--lime);color:#1b2a00}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn-quiet{background:var(--surface-2);color:var(--fg)}
.btn-brand{background:var(--brand);color:var(--brand-fg)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 40px 13px 42px;font-size:16px}
.search input:focus{border-color:var(--brand);outline:none}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--muted)}

.notice{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

.group{display:flex;flex-direction:column;gap:8px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-inline:2px}
.group-head span:last-child{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:400}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--lime-soft);color:var(--lime-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.row-main{min-width:0}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pill-new{display:inline-block;background:var(--lime);color:#1b2a00;font-family:var(--f-body);font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-bottom:2px}

.empty{text-align:center;padding:36px 20px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);font-size:18px;color:var(--fg);margin-bottom:4px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  max-height:92%;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (prefers-reduced-motion:no-preference) and (min-width:720px){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h3{font-family:var(--f-display);font-size:20px;margin:0}
.x{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--fg)}
.photo{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);max-height:220px;object-fit:contain;display:block}
.status{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-top:10px}
.status.err{background:var(--danger-soft);color:var(--danger)}
.status.ok{background:var(--lime-soft);color:var(--lime-ink)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}}

form.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
@media (max-width:480px){form.fields{grid-template-columns:1fr}}
.f label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--brand);outline:none}
.socials{display:flex;flex-direction:column;gap:8px}
.soc{display:grid;grid-template-columns:120px 1fr 36px;gap:8px}
@media (max-width:420px){.soc{grid-template-columns:96px 1fr 36px}}
.soc button{border:0;background:var(--surface-2);border-radius:10px;cursor:pointer;color:var(--muted)}
.link-btn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:4px 0;align-self:flex-start}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions .grow{flex:1 1 160px}

/* detail */
.d-hero{display:flex;gap:14px;align-items:center}
.d-hero .avatar{width:60px;height:60px;font-size:22px;border-radius:16px}
.d-name{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.d-role{color:var(--muted);overflow-wrap:anywhere}
.added{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.d-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px}
.d-item{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:11px 12px}
.d-item+.d-item{border-top:1px solid var(--line)}
.d-k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-v{min-width:0;overflow-wrap:anywhere;user-select:text}
.d-v a{color:var(--brand);font-weight:500}
.copy{border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--fg)}
.share-panel{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.share-panel strong{font-family:var(--f-display);font-size:16px}
.share-text{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.share-actions{display:flex;flex-wrap:wrap;gap:8px}
.qr-box{background:#ffffff;border-radius:12px;padding:10px;width:min(260px,100%);align-self:center}
.qr-box svg{display:block;width:100%;height:auto}
.qr-box.qr-fail{background:var(--surface-2);color:var(--muted);font-size:13px;width:100%}
.qr-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;color:var(--muted);font-size:14px;padding-top:6px}
.foot .link-btn{font-size:14px;text-decoration:none}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.login-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-box .logo{height:44px;width:auto;align-self:center}
.login-box h2{font-family:var(--f-display);font-size:24px;margin:0;text-align:center}
.login-box p{margin:0;text-align:center;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pin-input{letter-spacing:.5em;text-align:center;font-family:var(--f-mono)}
.share-hint{font-size:12px;color:var(--muted)}
.confirm{margin-top:12px;padding:12px;border-radius:12px;background:var(--danger-soft);color:var(--danger);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
</style>
</head>

  <header class="top">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const FIELDS = [
    ["name","Name",false],["title","Job title",false],["company","Company",true],
    ["phone","Phone",false],["mobile","Mobile",false],["email","Email",true],
    ["website","Website",true],["address","Address",true]
  ];
  // Cloudflare Worker that holds the Anthropic API key and reads the cards.
  const WORKER_URL = "https://sentrycardscanner.robert-fb9.workers.dev";
  const NETWORKS = ["LinkedIn","X / Twitter","Instagram","Facebook","YouTube","TikTok","WhatsApp","Other"];

  let contacts = [];
  let mode = "loading"; // loading | local
  let query = "";
  const ua = navigator.userAgent;
  const isApple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  /* ---------- storage: IndexedDB on this device ---------- */
  let idb = null;
  function openIdb(username){
    return new Promise((res, rej) => {
      const r = indexedDB.open("sentry-card-scanner-" + username, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("contacts", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function tx(modeRW, fn){
    return new Promise((res, rej) => {
      const t = idb.transaction("contacts", modeRW);
      const st = t.objectStore("contacts");
      const out = fn(st);
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  async function saveContact(c){
    await tx("readwrite", st => st.put(c));
    const i = contacts.findIndex(x => x.id === c.id);
    if (i >= 0) contacts[i] = c; else contacts.push(c);
    render();
  }
  async function removeContact(id){
    await tx("readwrite", st => st.delete(id));
    contacts = contacts.filter(c => c.id !== id); render();
  }
  const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  /* ---------- sign-in ---------- */
  const SKEY = "sentry-scanner-session";
  let session = null;
  try { session = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch {}
  async function api(path, body){
    const r = await fetch(WORKER_URL.replace(/\/$/,"") + path, {
      method:"POST",
      headers:{ "Content-Type":"application/json", ...(session ? { Authorization:"Bearer " + session.token } : {}) },
      body: JSON.stringify(body || {})
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && data.error === "signed_out") { signOut(true); throw { code:"signed_out" }; }
    if (!r.ok) throw { code: data.error || "upstream_error", data };
    return data;
  }

  function showLogin(msg){
    $("#loginLogo").src = document.querySelector(".brand .logo").src;
    $("#login").hidden = false;
    const err = $("#lg-err"); err.hidden = !msg; err.textContent = msg || "";
    setTimeout(() => ($("#lg-user").value ? $("#lg-secret") : $("#lg-user")).focus(), 50);
  }
  function setLoginMode(pin){
    $("#lg-pw").setAttribute("aria-pressed", String(!pin));
    $("#lg-pin").setAttribute("aria-pressed", String(pin));
    const i = $("#lg-secret");
    $("#lg-secret-label").textContent = pin ? "PIN" : "Password";
    i.inputMode = pin ? "numeric" : "text";
    i.classList.toggle("pin-input", pin);
    i.autocomplete = pin ? "one-time-code" : "current-password";
    i.value = ""; i.focus();
  }
  $("#lg-pw").onclick = () => setLoginMode(false);
  $("#lg-pin").onclick = () => setLoginMode(true);
  $("#loginForm").onsubmit = async e => {
    e.preventDefault();

    const kind = $("#lg-secret-label").textContent.toLowerCase();
    const err = $("#lg-err");
    if (!username || !secret) { err.hidden = false; err.textContent = "Enter your username and " + kind + "."; return; }
    $("#lg-go").disabled = true; err.hidden = true;
    try {
      session = null;
      const d = await api("/login", { username, secret });
      session = { token: d.token, user: d.user };
      try { localStorage.setItem(SKEY, JSON.stringify(session)); } catch {}
      $("#lg-secret").value = "";
      $("#login").hidden = true;
      await loadContacts();
    } catch (x) {
      err.hidden = false;
      err.textContent = ({
        bad_login: "That username and " + kind + " don't match." + (x.data && x.data.left ? " " + x.data.left + " tries left before the account locks." : ""),
        locked: "Too many wrong attempts. Try again in 15 minutes, or ask IT to unlock you.",
        disabled: "This account has been switched off. Ask IT if you need access.",
        not_configured: "The scanner isn't set up yet. Tell your IT manager."
      })[x && x.code] || (x instanceof TypeError ? "Couldn't reach the scanner. Check your signal and try again." : "Couldn't sign in. Try again.");
    } finally { $("#lg-go").disabled = false; }
  };
  function signOut(expired){
    session = null;
    try { localStorage.removeItem(SKEY); } catch {}
    contacts = []; idb = null; mode = "loading"; render(); closeSheet();
    showLogin(expired ? "You've been signed out. Sign in again to carry on." : "");
  }
  $("#signOut").onclick = () => signOut(false);

  async function loadContacts(){
    const u = session.user;
    $("#who").textContent = "Signed in as " + (u.name || u.username);
    $("#adminLink").hidden = $("#adminDot").hidden = u.role !== "admin";
    mode = "loading"; render();
    try {
      idb = await openIdb(u.username);
      contacts = await tx("readonly", st => st.getAll()) || [];
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
    } catch {
      note("This browser won't let the scanner save contacts. If you're in a private window, open it in a normal one.");
      contacts = [];
    }
    mode = "local"; render();
  }

  async function boot(){
    render();
    if (!session) { showLogin(); return; }
    await loadContacts();
    // Make sure the account is still active; switched-off users get signed out.
    try {
      const d = await api("/me");
      session.user = d.user;
      try { localStorage.setItem(SKEY, JSON.stringify(session)); } catch {}
      $("#who").textContent = "Signed in as " + (d.user.name || d.user.username);
      $("#adminLink").hidden = $("#adminDot").hidden = d.user.role !== "admin";

  function note(msg, append){
    const n = $("#notice");
    n.textContent = append && !n.hidden ? n.textContent + " " + msg : msg;
    n.hidden = false;
  }

  /* ---------- list ---------- */
  const fmtTime = ts => new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  const fmtFull = ts => new Date(ts).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  function dayLabel(ts){
    const d = new Date(ts), t = new Date(); t.setHours(0,0,0,0);
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diff = Math.round((t - dd) / 864e5);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  }
  const initials = c => ((c.name || c.company || "?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("") || "?").toUpperCase();
  const haystack = c => [c.name,c.title,c.company,c.phone,c.mobile,c.email,c.website,c.address,c.notes,
    ...(c.socials||[]).map(s => s.network + " " + s.url)].filter(Boolean).join(" ").toLowerCase();

  function render(){
    const res = $("#results");
    res.replaceChildren();
    $("#count").textContent = contacts.length + (contacts.length === 1 ? " contact" : " contacts");
    if (mode === "loading") {
      res.append(emptyBox("Loading your contacts…", "Cards you scan will appear here, newest first."));
      return;
    }
    const list = visible();
    $("#export").hidden = !list.length;
    $("#exportLabel").textContent = query && list.length !== contacts.length ? "Export " + list.length + " to CSV" : "Export CSV";
    if (!contacts.length) { res.append(emptyBox("No contacts yet", "Tap “Scan a card” to photograph your first business card.")); return; }
    if (!list.length) { res.append(emptyBox("No matches", "Nothing matches “" + query + "”. Try a name, company, email or number.")); return; }

    const groups = new Map();
    for (const c of list) {
      const k = dayLabel(c.createdAt || 0);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(c);
    }
    for (const [label, items] of groups) {
      const g = el("section","group");
      const h = el("div","group-head");
      h.append(el("span",null,label), el("span",null, items.length + " added"));
      const l = el("div","list");
      for (const c of items) l.append(rowFor(c));
      g.append(h,l); res.append(g);
    }
  }
  function emptyBox(title, sub){
    const e = el("div","empty"); e.append(el("strong",null,title), el("span",null,sub)); return e;
  }
  function avatarFor(c){
    const a = el("div","avatar");
    if (c.photo && /^data:image\//.test(c.photo)) { const i = new Image(); i.src = c.photo; i.alt = ""; a.append(i); }
    else a.textContent = initials(c);
    return a;
  }
  function rowFor(c){
    const b = el("button","row"); b.type = "button";
    const main = el("div","row-main");
    main.append(el("div","row-name", c.name || c.company || "Unnamed contact"),
      el("div","row-sub", [c.title, c.company].filter(Boolean).join(" · ") || c.email || c.phone || ""));
    const t = el("div","row-time");
    if (Date.now() - (c.createdAt||0) < 6*36e5) { t.append(el("span","pill-new","New"), document.createElement("br")); }
    t.append(document.createTextNode(fmtTime(c.createdAt||0)));
    b.append(avatarFor(c), main, t);
    b.onclick = () => openDetail(c.id);
    return b;
  }

  /* ---------- sheets ---------- */
  function openSheet(){ $("#scrim").hidden = false; $("#sheet").hidden = false; $("#sheet").scrollTop = 0; }
  function closeSheet(){ if (scanCtl) scanCtl.abort(); $("#scrim").hidden = true; $("#sheet").hidden = true; $("#sheet").replaceChildren(); }
  $("#scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
  function sheetHead(title){
    const s = $("#sheet"); s.replaceChildren();
    s.append(el("div","grab"));
    const h = el("div","sheet-head"); const x = el("button","x","✕"); x.type="button"; x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
    h.append(el("h3",null,title), x); s.append(h);
    return s;
  }

  /* ---------- scanning ---------- */
  let scanCtl = null;
  $("#cam").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) startScan(f); };
  $("#pick").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) startScan(f); };
  $("#manual").onclick = () => openEditor({ id:newId(), socials:[] }, { isNew:true });

  async function startScan(file){
    if (!session) { showLogin(); return; }
    const thumb = await makeThumb(file).catch(() => null);
    const draft = { id:newId(), socials:[], photo:thumb || "" };
    const ui = openEditor(draft, { isNew:true, scanning:true });
    scanCtl = new AbortController();
    try {
      const img = await prepImage(file);
      const data = await api("/scan", img);
      const r = normalise(data.card);
      ui.fill(r);
      const found = FIELDS.filter(([k]) => r[k]).length + r.socials.length;
      ui.status(found ? "ok" : "err", found ? "Read " + found + " detail" + (found===1?"":"s") + ". Check them before saving." : "Couldn't read any details. Try a sharper, well-lit photo or type them in.");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      const code = e && e.code;
      if (code === "signed_out") return;
      const msg = {
        rate_limited:"Too many scans in a short time. Wait a minute and try again.",
        bad_image:"That image couldn't be read. Try another photo.",
        image_too_large:"That photo is too large. Try again with a normal camera photo.",
        unreadable:"The card couldn't be read cleanly. Try again with a straighter photo.",
        no_credit:"Scanning is paused because the Claude API account is out of credit. Tell your IT manager.",
        bad_api_key:"The scanner isn't set up correctly (API key). Tell your IT manager.",
        not_configured:"The scanner isn't set up yet. Tell your IT manager.",
        forbidden_origin:"This copy of the scanner isn't allowed to read cards."
      }[code] || (e instanceof TypeError ? "Couldn't reach the scanner. Check your signal and try again." : "Something went wrong reading the card. Try again, or type the details in.");
      ui.status("err", msg);
    } finally { scanCtl = null; }
  }

  // Shrink the photo before sending: quicker on mobile data, and well within Claude's limits.
  function prepImage(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res({ mediaType:"image/jpeg", image: c.toDataURL("image/jpeg", 0.85).split(",")[1] });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej({ code:"bad_image" }); };
      img.src = url;
    });
  }

  function normalise(o){
    const s = v => (typeof v === "string" ? v.trim() : "");
    const r = {};
    for (const [k] of FIELDS) r[k] = s(o && o[k]);
    r.notes = s(o && o.notes);
    r.socials = Array.isArray(o && o.socials) ? o.socials
      .map(x => ({ network: NETWORKS.includes(s(x && x.network)) ? s(x.network) : "Other", url: s(x && x.url) }))
      .filter(x => x.url).slice(0,8) : [];
    return r;
  }

  function makeThumb(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 520, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.62));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }

  /* ---------- editor ---------- */
  function openEditor(contact, opts){
    const s = sheetHead(opts.isNew ? (opts.scanning ? "New contact from card" : "New contact") : "Edit contact");
    if (contact.photo) { const p = new Image(); p.className = "photo"; p.src = contact.photo; p.alt = "Photo of the business card"; s.append(p); }
    const st = el("div","status"); st.hidden = !opts.scanning;
    if (opts.scanning) { st.append(el("span","spin"), el("span",null,"Reading the card…")); }
    s.append(st);

    const form = el("form","fields"); form.noValidate = true;
    const inputs = {};
    for (const [k,label,full] of FIELDS) {
      const f = el("div","f" + (full ? " full" : ""));
      const id = "f-" + k;
      const lab = el("label",null,label); lab.htmlFor = id;
      const inp = document.createElement(k === "address" ? "textarea" : "input");
      inp.id = id; inp.value = contact[k] || "";
      if (k === "email") { inp.type = "email"; inp.autocomplete = "off"; }
      if (k === "phone" || k === "mobile") inp.type = "tel";
      if (k === "website") inp.inputMode = "url";
      inputs[k] = inp; f.append(lab, inp); form.append(f);
    }
    // socials
    const sf = el("div","f full"); sf.append(el("label",null,"Social links"));
    const socBox = el("div","socials"); sf.append(socBox);
    const addSoc = (net="LinkedIn", url="") => {
      const row = el("div","soc");
      const sel = document.createElement("select");
      sel.className = "soc-net"; sel.setAttribute("aria-label","Network");
      Object.assign(sel.style,{background:"var(--surface)",border:"1.5px solid var(--line)",borderRadius:"10px",padding:"8px",fontSize:"15px",minWidth:"0"});
      for (const n of NETWORKS) { const o = document.createElement("option"); o.textContent = n; if (n === net) o.selected = true; sel.append(o); }
      const u = document.createElement("input"); u.className = "soc-url"; u.value = url; u.placeholder = "Profile link or @handle"; u.setAttribute("aria-label","Profile link or handle");
      Object.assign(u.style,{background:"var(--surface)",border:"1.5px solid var(--line)",borderRadius:"10px",padding:"10px 12px",fontSize:"16px",minWidth:"0",width:"100%"});
      const rm = el("button",null,"✕"); rm.type="button"; rm.setAttribute("aria-label","Remove link"); rm.onclick = () => row.remove();
      row.append(sel,u,rm); socBox.append(row);
    };
    (contact.socials||[]).forEach(x => addSoc(x.network, x.url));
    const addBtn = el("button","link-btn","+ Add social link"); addBtn.type="button"; addBtn.onclick = () => addSoc();
    sf.append(addBtn); form.append(sf);
    const nf = el("div","f full"); const nl = el("label",null,"Notes"); nl.htmlFor = "f-notes";
    const nt = document.createElement("textarea"); nt.id = "f-notes"; nt.value = contact.notes || "";
    nf.append(nl, nt); form.append(nf);
    s.append(form);

    const act = el("div","actions");
    const save = el("button","btn btn-brand grow", opts.isNew ? "Save contact" : "Save changes"); save.type = "button";
    const cancel = el("button","btn btn-quiet","Cancel"); cancel.type = "button"; cancel.onclick = closeSheet;
    act.append(save, cancel); s.append(act);
    openSheet();

    save.onclick = async () => {
      const c = { ...contact };
      for (const [k] of FIELDS) c[k] = inputs[k].value.trim();
      c.notes = nt.value.trim();
      c.socials = [...socBox.querySelectorAll(".soc")].map(r => ({ network: r.querySelector(".soc-net").value, url: r.querySelector(".soc-url").value.trim() })).filter(x => x.url);
      if (!c.name && !c.company && !c.email && !c.phone && !c.mobile) { setStatus("err","Add at least a name, company, email or phone number."); return; }
      if (!c.createdAt) c.createdAt = Date.now();
      c.updatedAt = Date.now();
      save.disabled = true;
      try {
        await saveContact(c);
        closeSheet(); toast(opts.isNew ? "Contact saved" : "Changes saved");
      } catch (e) {
        save.disabled = false;
        setStatus("err", e && e.code === "quota_exceeded" ? "Storage is full. Delete some contacts and try again." : "Couldn't save. Check your connection and try again.");
      }
    };
    function setStatus(kind, text){
      st.hidden = false; st.className = "status " + (kind || ""); st.replaceChildren(el("span",null,text));
      st.scrollIntoView({block:"nearest"});
    }
    return {
      status: setStatus,
      fill(r){
        for (const [k] of FIELDS) if (r[k] && !inputs[k].value) inputs[k].value = r[k];
        if (r.notes && !nt.value) nt.value = r.notes;
        socBox.replaceChildren(); r.socials.forEach(x => addSoc(x.network, x.url));
      }
    };
  }

  /* ---------- detail ---------- */
  const safeUrl = (v, network) => {
    let u = (v||"").trim(); if (!u) return null;
    if (/^@/.test(u)) {
      const h = u.slice(1);
      const base = { "X / Twitter":"https://x.com/", "Instagram":"https://instagram.com/", "TikTok":"https://tiktok.com/@", "YouTube":"https://youtube.com/@" }[network];
      return base ? base + encodeURIComponent(h) : null;
    }
    if (!/^https?:\/\//i.test(u)) { if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(u)) u = "https://" + u; else return null; }
    try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : null; } catch { return null; }
  };

  function openDetail(id){
    const c = contacts.find(x => x.id === id); if (!c) return;

    hero.append(avatarFor(c), info); s.append(hero);

    const list = el("div","d-list");
    const item = (k, text, href) => {
      const r = el("div","d-item");

      if (href) { const a = el("a",null,text); a.href = href; if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; } v.append(a); }
      else v.textContent = text;
      const cp = el("button","copy","Copy"); cp.type = "button";

        catch { const rg = document.createRange(); rg.selectNodeContents(v); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast("Selected — copy it from the menu"); }
      };
      r.append(el("div","d-k",k), v, cp); list.append(r);
    };
    if (c.phone) item("Phone", c.phone, "tel:" + c.phone.replace(/[^\d+]/g,""));
    if (c.mobile) item("Mobile", c.mobile, "tel:" + c.mobile.replace(/[^\d+]/g,""));
    if (c.email) item("Email", c.email, "mailto:" + c.email);
    if (c.website) item("Website", c.website, safeUrl(c.website));
    if (c.address) item("Address", c.address);
    for (const so of (c.socials||[])) item(so.network, so.url, safeUrl(so.url, so.network));
    if (c.notes) item("Notes", c.notes);
    if (list.children.length) s.append(list);

    if (c.photo) { const p = new Image(); p.className = "photo"; p.src = c.photo; p.alt = "Photo of the business card"; p.style.marginTop = "14px"; s.append(p); }

    const act = el("div","actions");

    act.append(edit);
    const addp = el("a","btn btn-quiet","Add to phone contacts");
    addp.href = URL.createObjectURL(new Blob([vcard(c)], { type:"text/vcard;charset=utf-8" }));
    if (!isApple) addp.download = fileBase(c) + ".vcf";
    addp.onclick = () => toast(isApple ? "Scroll down and tap Create New Contact" : "Open the download and choose Contacts");
    act.append(addp);
    const sh = el("button","btn btn-lime","Share"); sh.type="button";
    act.insertBefore(sh, act.children[1] || null);
    const del = el("button","btn btn-danger","Delete"); del.type="button";
    act.append(del); s.append(act);
    const conf = el("div","confirm"); conf.hidden = true;
    conf.append(el("span",null,"Delete this contact for good?"));
    const yes = el("button","btn btn-danger","Delete"); yes.type="button"; yes.style.boxShadow="inset 0 0 0 1.5px currentColor";
    const no = el("button","btn btn-quiet","Keep"); no.type="button";
    const cb = el("div"); cb.style.display="flex"; cb.style.gap="8px"; cb.append(no,yes); conf.append(cb);
    s.append(conf);
    const sp = el("div","share-panel"); sp.hidden = true;
    sp.append(el("strong",null,"Share this contact"));
    const text = shareText(c);
    const pre = el("pre","share-text", text); sp.append(pre);
    const sa = el("div","share-actions");
    const cpy = el("button","btn btn-brand","Copy details"); cpy.type="button";
    cpy.onclick = async () => {
      try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into WhatsApp, Teams, a text or an email"); }
      catch { const rg = document.createRange(); rg.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast("Selected. Copy it from the menu"); }
    };
    const mail = el("a","btn btn-quiet","Email it");
    mail.href = "mailto:?subject=" + encodeURIComponent("Contact: " + (c.name || c.company || "business card")) + "&body=" + encodeURIComponent(text);
    sa.append(cpy, mail);
    if (navigator.share) {
      const ns = el("button","btn btn-quiet","Share via…"); ns.type = "button";
      ns.onclick = async () => {
        const file = new File([vcard(c)], fileBase(c) + ".vcf", { type:"text/vcard" });
        try {
          if (navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file], title: c.name || c.company || "Contact", text });
          else await navigator.share({ title: c.name || c.company || "Contact", text });
        } catch (e) { if (e && e.name !== "AbortError") { try { await navigator.share({ text }); } catch {} } }
      };
      sa.prepend(ns);
    }
    const qrb = el("button","btn btn-quiet","Show QR code"); qrb.type="button";
    sa.append(qrb);
    sp.append(sa, el("div","share-hint","Share via… opens your phone's share menu (WhatsApp, Messages, Teams and so on). If the other person is with you, Show QR code and they scan it with their camera to save the contact straight into their phone."));
    s.insertBefore(sp, conf);
    const qp = qrPanel(c); s.insertBefore(qp, conf);
    const showQR = () => { qp.hidden = false; sp.hidden = true; qp.scrollIntoView({block:"nearest"}); };
    qrb.onclick = showQR;
    sh.onclick = () => { sp.hidden = !sp.hidden; if (!sp.hidden) { qp.hidden = true; sp.scrollIntoView({block:"nearest"}); } };
    del.onclick = () => { conf.hidden = false; conf.scrollIntoView({block:"nearest"}); };
    no.onclick = () => { conf.hidden = true; };
    yes.onclick = async () => {
      yes.disabled = true;
      try { await removeContact(c.id); closeSheet(); toast("Contact deleted"); }
      catch { yes.disabled = false; toast("Couldn't delete. Try again."); }
    };
    openSheet();
  }

  function qrPanel(c){
    const p = el("div","share-panel"); p.hidden = true;
    p.append(el("strong",null,"Add to phone contacts"));
    const box = el("div","qr-box");
    let card = vcard(c, true);
    try {
      if (typeof qrcode !== "function") throw 0;
      const q = qrcode(0, "L");
      q.addData(unescape(encodeURIComponent(card)), "Byte");
      q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 3, scalable: true });
      const svg = box.querySelector("svg"); if (svg) { svg.setAttribute("role","img"); svg.setAttribute("aria-label","QR code for " + (c.name || c.company || "this contact")); }
    } catch {
      box.classList.add("qr-fail");
      box.textContent = "The QR code couldn't be drawn. Use Share then Copy details instead.";
    }
    p.append(box);
    const steps = el("ol","qr-steps");
    const li = (b, t) => { const x = el("li"); x.append(el("b",null,b), document.createTextNode(" " + t)); steps.append(x); };
    li("From another screen:", "point your iPhone or Android camera at the code and tap Add to Contacts (on Android, tap the link that appears, then Add contact).");
    li("On this phone:", "take a screenshot, open it in Photos (iPhone) or Google Photos / Lens (Android), tap the code, then Add to Contacts.");
    p.append(steps);
    return p;
  }

  function fileBase(c){ return (c.name || c.company || "contact").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-") || "contact"; }

  function b64url(str){
    const bytes = new TextEncoder().encode(str);
    let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }

  function shareText(c){
    const L = [];
    if (c.name) L.push(c.name);
    const role = [c.title, c.company].filter(Boolean).join(", ");
    if (role) L.push(role);
    if (c.phone) L.push("Phone: " + c.phone);
    if (c.mobile) L.push("Mobile: " + c.mobile);
    if (c.email) L.push("Email: " + c.email);
    if (c.website) L.push("Web: " + c.website);
    if (c.address) L.push("Address: " + c.address.replace(/\s*\n\s*/g, ", "));
    for (const so of (c.socials||[])) L.push(so.network + ": " + so.url);
    if (c.notes) L.push("Notes: " + c.notes);
    return L.join("\n");
  }

  function vcard(c, compact){
    const esc = v => String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g, m => "\\" + m);
    const parts = (c.name||"").trim().split(/\s+/);
    const last = parts.length > 1 ? parts.pop() : ""; const first = parts.join(" ");
    const L = ["BEGIN:VCARD","VERSION:3.0","FN:" + esc(c.name || c.company || "Contact"),"N:" + esc(last) + ";" + esc(first) + ";;;"];
    if (c.company) L.push("ORG:" + esc(c.company));
    if (c.title) L.push("TITLE:" + esc(c.title));
    if (c.phone) L.push("TEL;TYPE=WORK,VOICE:" + esc(c.phone));
    if (c.mobile) L.push("TEL;TYPE=CELL:" + esc(c.mobile));
    if (c.email) L.push("EMAIL;TYPE=INTERNET:" + esc(c.email));
    if (c.website) L.push("URL:" + esc(safeUrl(c.website) || c.website));
    if (c.address) L.push("ADR;TYPE=WORK:;;" + esc(c.address) + ";;;;");
    for (const so of (c.socials||[])) L.push("X-SOCIALPROFILE;TYPE=" + esc(so.network) + ":" + esc(safeUrl(so.url, so.network) || so.url));
    const n = compact ? (c.notes || "") : [c.notes, "Added " + fmtFull(c.createdAt||Date.now())].filter(Boolean).join("\n");
    if (n) L.push("NOTE:" + esc(n));
    L.push("END:VCARD");
    return L.join("\r\n");
  }

  function visible(){
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    return contacts
      .filter(c => !terms.length || terms.every(t => haystack(c).includes(t)))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  /* ---------- CSV export ---------- */
  function csvCell(v){
    let s = String(v == null ? "" : v);
    if (/^[=@]/.test(s) || (/^[+\-]/.test(s) && /[A-Za-z=]/.test(s))) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  function toCSV(list){
    const head = ["Name","Job title","Company","Phone","Mobile","Email","Website","Address","LinkedIn","Other social links","Notes","Date added"];
    const pad = n => String(n).padStart(2,"0");
    const stamp = ts => { const d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
    const rows = list.map(c => {
      const soc = c.socials || [];
      const li = soc.filter(s => s.network === "LinkedIn").map(s => s.url).join(" | ");
      const other = soc.filter(s => s.network !== "LinkedIn").map(s => s.network + ": " + s.url).join(" | ");
      return [c.name,c.title,c.company,c.phone,c.mobile,c.email,c.website,(c.address||"").replace(/\s*\n\s*/g,", "),li,other,c.notes,stamp(c.createdAt||0)];
    });
    return "﻿" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
  }
  $("#export").onclick = () => {
    const list = visible(); if (!list.length) return;
    const d = new Date(), pad = n => String(n).padStart(2,"0");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([toCSV(list)], { type:"text/csv;charset=utf-8" }));
    a.download = "contacts-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".csv";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast("Exported " + list.length + (list.length === 1 ? " contact" : " contacts"));
  };

  function parseCSV(text){
    const rows = []; let row = [], cell = "", q = false;
    text = text.replace(/^\ufeff/, "");
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i+1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim()));
  }
  $("#importFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const rows = parseCSV(await f.text());
      if (rows.length < 2) throw 0;
      const head = rows[0].map(h => h.trim().toLowerCase());
      const col = n => head.indexOf(n);
      const map = { name:"name", title:"job title", company:"company", phone:"phone", mobile:"mobile", email:"email", website:"website", address:"address", notes:"notes" };
      if (col("name") < 0 && col("company") < 0) throw 0;
      const unq = v => String(v || "").replace(/^'(?=[=@+\-])/, "").trim();
      const have = new Set(contacts.map(c => [c.name,c.email,c.phone,c.mobile].join("|").toLowerCase()));
      let added = 0;
      for (const r of rows.slice(1)) {
        const c = { id:newId(), socials:[] };
        for (const [k, h] of Object.entries(map)) c[k] = col(h) >= 0 ? unq(r[col(h)]) : "";
        const li = col("linkedin") >= 0 ? unq(r[col("linkedin")]) : "";
        if (li) li.split(" | ").forEach(u => u && c.socials.push({ network:"LinkedIn", url:u }));
        const other = col("other social links") >= 0 ? unq(r[col("other social links")]) : "";
        if (other) other.split(" | ").forEach(p => { const m = p.match(/^([^:]+):\s*(.+)$/); if (m) c.socials.push({ network: NETWORKS.includes(m[1].trim()) ? m[1].trim() : "Other", url:m[2].trim() }); });
        const da = col("date added") >= 0 ? unq(r[col("date added")]) : "";
        const m = da.match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/);
        c.createdAt = m ? new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)).getTime() : Date.now();
        c.updatedAt = c.createdAt;
        if (!c.name && !c.company && !c.email && !c.phone && !c.mobile) continue;
        const key = [c.name,c.email,c.phone,c.mobile].join("|").toLowerCase();
        if (have.has(key)) continue;
        have.add(key);
        await tx("readwrite", st => st.put(c)); contacts.push(c); added++;
      }
      render();
      toast(added ? "Imported " + added + (added === 1 ? " contact" : " contacts") : "No new contacts in that file");
    } catch {
      toast("That file couldn't be imported. Use a CSV exported from the scanner.");
    }
  };

  /* ---------- search ---------- */
  let qt;
  $("#q").addEventListener("input", e => {
    clearTimeout(qt);
    $("#clearq").hidden = !e.target.value;
    qt = setTimeout(() => { query = e.target.value.trim(); render(); }, 120);
  });
  $("#clearq").onclick = () => { $("#q").value = ""; query = ""; $("#clearq").hidden = true; render(); $("#q").focus(); };

  /* ---------- utils ---------- */
  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  let tt;
  function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

  boot();
})();
</script>
